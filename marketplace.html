  <!-- 预加载首屏关键脚本：与底部 <script> 同源同版本，浏览器复用同一请求，提升打开速度 -->
  <link rel="preload" href="marketplace.js?v=15" as="script" />
  <script>
    // 避免主题闪烁：在渲染前应用已保存的主题

  </script>
  <style>
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif);
    }
    .mk-wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 56px; }
    .mk-top {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 0 14px; border-bottom: 1px solid var(--border);
    }
    .mk-back {
      color: var(--text-2); text-decoration: none; font-size: 14px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .mk-back:hover { color: var(--text); }
    .mk-top h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; }
    .mk-who { font-size: 13px; color: var(--text-2); }
    .mk-who b { color: var(--primary); font-weight: 600; }
    /* 桌面端无变化(h1 flex:1 撑开中间,mk-who + publishBtn 自然靠右)。
       移动端 h1 display:none 后,顶栏布局靠左,需把 .mk-who margin-left:auto
       让 [你好 + 发布] 推到右端,与左侧 [← 返回应用] 对称。 */
    .mk-tabs { display: flex; gap: 8px; margin: 16px 0 10px; }
    .mk-tab {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
      padding: 7px 16px; border-radius: 999px; font-size: 14px; cursor: pointer;
    }
    .mk-tab.active { color: #fff; background: var(--primary); border-color: var(--primary); }
    .mk-filters { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 16px; font-size: 14px; color: var(--text-2); }
    .mk-filters label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .mk-grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .mk-card {
      border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .mk-card-head { display: flex; align-items: center; gap: 12px; }
    .mk-banner { width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-top: 2px; }
    .mk-banner img { width: 100%; max-height: 160px; object-fit: cover; display: block; }

    /* 应用市场头部 Banner 广告位：内容区 1080 宽，930×300 居中，前后各露出部分 banner（peek 轮播） */
    .mk-banner-slot {
      position: relative; width: 1080px; max-width: 100%; height: 300px;
      margin: 4px auto 0; overflow: hidden; border-radius: 16px;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .mk-banner-track {
      display: flex; height: 100%; transition: transform .5s ease; will-change: transform;
      /* 默认偏移 0：移动端 itemW ≈ slot.clientWidth，0 等于居中。
         桌面端在下方 @media (min-width:931px) 里用 CSS 变量覆写为 -855px
         （首张真实居中：offset = (1080-930)/2 - 930 = -855）。
         这样 SSR 首帧 paint 即可居中,无需等待 JS measure()。 */
      transform: translateX(var(--banner-track-x, 0));
    }
    @media (min-width: 931px) {
      .mk-banner-slot { --banner-track-x: -855px; }
    }
    .mk-banner-item {
      position: relative; flex: 0 0 930px; width: 930px; max-width: 100%; height: 100%;
      border: 0; border-radius: 0; overflow: hidden; cursor: pointer;
      background: var(--surface-2); display: block; text-align: left; padding: 0; color: inherit;
    }
    .mk-banner-item .mk-bi-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .mk-banner-item .mk-bi-mask {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.62) 100%);
    }
    .mk-banner-item .mk-bi-body {
      position: absolute; left: 14px; right: 70px; bottom: 12px; display: flex; align-items: center; gap: 10px; z-index: 2;
    }
    .mk-banner-item .mk-bi-icon {
      width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; overflow: hidden;
      background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary);
    }
    .mk-banner-item .mk-bi-icon img { width: 100%; height: 100%; object-fit: cover; }
    .mk-banner-item .mk-bi-text { color: #fff; min-width: 0; }
    .mk-banner-item .mk-bi-name { font-weight: 600; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mk-banner-item .mk-bi-sub { font-size: 12px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mk-banner-item .mk-bi-tag {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff;
    }
    /* 无图时的纯色创意 */
    .mk-banner-item.mk-bi-plain { background: linear-gradient(135deg, var(--primary), #7c5cff); }
    .mk-banner-item.mk-bi-plain .mk-bi-mask { display: none; }
    .mk-banner-item.mk-bi-plain .mk-bi-text { color: #fff; }
    .mk-banner-item.mk-bi-plain .mk-bi-icon { background: rgba(255,255,255,.92); }
    /* 轮播指示点 */
    .mk-banner-dots {
      position: absolute; right: 14px; bottom: 14px; z-index: 3; display: flex; gap: 6px;
    }
    .mk-bi-dot {
      width: 8px; height: 8px; border: 0; padding: 0; border-radius: 999px;
      background: rgba(255,255,255,.55); cursor: pointer; transition: background .2s, width .2s;
    }
    .mk-bi-dot.active { background: #fff; width: 18px; }
    /* 左右切换箭头（hover 时显示） */
    .mk-bi-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 34px; height: 34px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(0,0,0,.35); color: #fff; font-size: 22px; line-height: 1;
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s;
    }
    .mk-banner-slot:hover .mk-bi-arrow { opacity: 1; }
    .mk-bi-arrow.prev { left: 10px; }
    .mk-bi-arrow.next { right: 10px; }

    /* 点击 Banner 弹出的菜单 */
    .mk-banner-menu {
      position: fixed; z-index: 300; min-width: 180px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .mk-banner-menu[hidden] { display: none; }
    .mk-banner-menu button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .mk-banner-menu button:hover { background: var(--surface-2); }
    .mk-icon {
      width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-weight: 700; color: var(--primary); font-size: 18px;
    }
    .mk-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mk-title { font-weight: 600; font-size: 15px; margin: 0; }
    .mk-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .mk-desc { font-size: 13px; color: var(--text-2); line-height: 1.5; min-height: 20px; }
    .mk-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .mk-badge {
      font-size: 12px; padding: 2px 9px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-2);
    }
    .mk-badge.on-pc { color: #1a7f37; border-color: rgba(26,127,55,.35); background: rgba(26,127,55,.10); }
    .mk-badge.on-mobile { color: #d97706; border-color: rgba(217,119,6,.35); background: rgba(217,119,6,.10); }
    .mk-badge.on-pwa { color: #2563eb; border-color: rgba(37,99,235,.35); background: rgba(37,99,235,.10); }
    .mk-card-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
    .mk-open {
      flex: 1; text-align: center; text-decoration: none;
      border: 1px solid var(--border); border-radius: 10px; padding: 8px; font-size: 13px;
      color: var(--text); background: var(--bg);
    }
    .mk-open:hover { border-color: var(--primary); color: var(--primary); }
    .mk-del {
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px;
      background: var(--surface); color: var(--text-2); cursor: pointer;
    }
    .mk-del:hover { color: #d23; border-color: #d23; }
    .mk-save {
      border: 1px solid var(--primary); border-radius: 10px; padding: 8px 12px; font-size: 13px;
      background: var(--surface); color: var(--primary); cursor: pointer; white-space: nowrap;
    }
    .mk-save:hover { background: var(--primary); color: #fff; }
    .mk-save:disabled { opacity: .65; cursor: default; border-color: var(--border); color: var(--text-2); background: var(--surface); }
    .mk-like {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px;
      background: var(--surface); color: var(--text-2); cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    .mk-like:hover { border-color: #e2556e; color: #e2556e; }
    .mk-like .mk-like-heart { font-size: 15px; line-height: 1; }
    .mk-like.liked {
      color: #e2556e; border-color: rgba(226,85,110,.45); background: rgba(226,85,110,.10);
    }
    .mk-like.liked:hover { color: #e2556e; }
    .mk-like .mk-like-count { font-variant-numeric: tabular-nums; min-width: 8px; text-align: center; }
    .mk-edit {
      border: 1px solid rgba(183,121,31,.5); border-radius: 10px; padding: 8px 12px; font-size: 13px;
      background: rgba(183,121,31,.10); color: #b7791f; cursor: pointer; white-space: nowrap;
    }
    .mk-edit:hover { background: rgba(183,121,31,.20); }
    .mk-status { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
    .mk-status.pending { color: #b7791f; background: rgba(183,121,31,.12); }
    .mk-status.approved { color: #1a7f37; background: rgba(26,127,55,.12); }
    .mk-status.rejected { color: #d23; background: rgba(221,34,51,.12); }
    .mk-msg { text-align: center; color: var(--text-2); padding: 40px 0; font-size: 14px; }
    .mk-empty { text-align: center; color: var(--text-2); padding: 40px 0; font-size: 14px; }

    /* 骨架屏（tab 切换 / 筛选 / 首屏客户端加载时占位） */
    :root {
      --skel-base: rgba(0,0,0,.06);
      --skel-shine: rgba(0,0,0,.12);
    }
    [data-theme="dark"] {
      --skel-base: rgba(255,255,255,.07);
      --skel-shine: rgba(255,255,255,.14);
    }
    .mk-card--skel { pointer-events: none; }
    .mk-skel {
      position: relative; overflow: hidden;
      background: var(--skel-base); border-radius: 8px;
    }
    .mk-skel::after {
      content: ""; position: absolute; inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, var(--skel-shine), transparent);
      animation: mk-shimmer 1.3s infinite;
    }
    @keyframes mk-shimmer { 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) {
      .mk-skel::after { animation: none; }
    }
    .mk-skel-icon { width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto; }
    .mk-skel-text { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .mk-skel-line { height: 12px; }
    .mk-skel-line-sm { height: 10px; }
    .mk-skel-badges { display: flex; gap: 6px; }
    .mk-skel-pill { width: 66px; height: 20px; border-radius: 999px; }
    .mk-skel-btn { flex: 1; height: 36px; border-radius: 10px; }

    /* 发布弹窗 */
    .mk-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200;
    }
    /* 修复：hidden 属性需覆盖上面的 display:flex（否则弹窗关不掉、且首屏就显示）*/
    .mk-modal[hidden] { display: none; }
    .mk-modal-card {
      width: 100%; max-width: 460px; max-height: 90vh; overflow: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
    }
    .mk-modal-head { display: flex; align-items: center; font-weight: 600; font-size: 16px; margin-bottom: 12px; }
    .mk-modal-head button { margin-left: auto; border: none; background: none; color: var(--text-2); font-size: 18px; cursor: pointer; }
    .mk-field { margin-bottom: 12px; }
    .mk-field label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 5px; }
    .mk-field input[type="text"], .mk-field textarea {
      width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px;
      font-family: inherit;
    }
    .mk-field textarea { resize: vertical; min-height: 64px; }
    .mk-check { display: flex; align-items: center; gap: 9px; padding: 9px 0; font-size: 14px; cursor: pointer; }
    .mk-check input { width: 16px; height: 16px; }
    .mk-submit {
      width: 100%; margin-top: 6px; padding: 11px; border: none; border-radius: 10px;
      background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .mk-submit:disabled { opacity: .6; cursor: default; }
    #notice {
      margin-top: 18px; padding: 16px 18px; border: 1px solid var(--border);
      border-radius: 14px; background: var(--surface); color: var(--text-2); font-size: 14px;
    }
    #notice a { color: var(--primary); }
    .avatar-img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
    @media (max-width: 560px) {
      .mk-grid { grid-template-columns: 1fr; }
      /* 移动端顶栏去掉"应用广场"标题,避免被 [返回应用] 与 [发布应用] 挤压换行 */
      .mk-top h1 { display: none; }
      /* 移动端 banner 限高:桌面 300px 在窄屏占满半屏,改 168px (~16:9) 更紧凑。
         banner item 内容在底部,降低高度不影响图标/标题相对位置。 */
      .mk-banner-slot { height: 168px; border-radius: 12px; }
      /* 移动端 banner item 必须 100% 宽,否则 930px 固定宽在 ~400 slot 里只露出 item 中段,
         用户看到的"居中"和"滚动"都会失真。改 100% 后 measure() 算 itemW≈slotW,
         go(1) transform = -slotW,vp 0..slotW 显示 item[clone-index=1] 整张 = 真实首张。 */
      .mk-banner-item { flex-basis: 100%; width: 100%; }
      .mk-banner-item .mk-bi-name { font-size: 14px; }
      .mk-banner-item .mk-bi-sub { font-size: 11px; }
      .mk-banner-item .mk-bi-icon { width: 36px; height: 36px; border-radius: 10px; }
      .mk-banner-item .mk-bi-body { left: 12px; right: 56px; bottom: 10px; gap: 8px; }
      .mk-banner-item .mk-bi-tag { top: 8px; left: 8px; font-size: 10px; padding: 2px 7px; }
      .mk-bi-dot { width: 6px; height: 6px; }
      .mk-bi-dot.active { width: 14px; }
      .mk-banner-dots { right: 10px; bottom: 10px; gap: 5px; }
      /* 移动端顶栏内边距收紧一点,给 banner 留更多视口 */
      .mk-top { padding: 4px 0 10px; gap: 8px; }
      .mk-back { font-size: 13px; }
      #publishBtn { padding: 8px 12px; font-size: 13px; }
      /* h1 display:none 后,顶栏 [← 返回应用][你好 踏浪][+ 发布应用] 整体靠左,
         不符合常见 UI 模式。给 .mk-who 加 margin-left:auto 让 [你好 + 发布] 推到右端,
         与左侧返回键对称。 */
      .mk-who { margin-left: auto; }
    }
  /* 版本更新提示条（与首页一致） */
  .update-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 300;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; background: var(--primary); color: #fff;
    font-size: 14px; box-shadow: var(--shadow);
  }
  .update-banner[hidden] { display: none; }
  .update-banner .update-icon { display: inline-flex; line-height: 1; }
  .update-banner .update-icon svg { width: 18px; height: 18px; display: block; }
  .update-banner .update-text { flex: 1 1 auto; }
  .update-banner .btn.small {
    background: rgba(255, 255, 255, 0.22); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.55); padding: 5px 12px;
  }
  .update-banner .btn.small:hover { background: rgba(255, 255, 255, 0.34); }
  </style>
</head>
<body>
  <!-- 版本更新提示条（检测到新版本时由 marketplace.js 显示） -->
  <div id="updateBanner" class="update-banner" hidden>
    <span class="update-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 6.9H22l-6 4.3 2.3 7-6.3-4.4L5.7 20.2 8 13.2 2 8.9h7.6z" fill="currentColor"/></svg></span>
    <span id="updateText" class="update-text">已更新到新版本</span>
    <button id="updateReload" class="btn small" type="button">刷新</button>
  </div>
  <div class="mk-wrap">
    <div class="mk-top">
      <a class="mk-back" id="mkBack" href="index.html">← 返回应用</a>
      <h1>应用广场</h1>
      <div class="mk-who" id="mkWho" hidden>你好，<b></b></div>
      <button id="publishBtn" class="btn primary">＋ 发布应用</button>
    </div>

    <!-- 应用市场头部 Banner 广告位：后台把应用设为头部门面后在此横向展示 -->
    <div id="mkBanner" class="mk-banner-slot" hidden></div>
    <!-- 点击 Banner 弹出的菜单：添加应用 / 立即打开 -->
    <div id="mkBannerMenu" class="mk-banner-menu" hidden></div>

    <div id="notice" hidden></div>

    <div class="mk-tabs">
      <button class="mk-tab active" data-tab="plaza">广场</button>
      <button class="mk-tab" data-tab="mine">我的发布</button>
    </div>

    <div id="plazaView">
      <div class="mk-filters">
        <label><input type="checkbox" id="fPc" /> 仅 PC 可用</label>
        <label><input type="checkbox" id="fMobile" /> 仅手机可用</label>
        <label><input type="checkbox" id="fPwa" /> 仅支持 PWA</label>
      </div>
      <div class="mk-grid" id="mkGrid"><div class="mk-msg">加载中…</div></div>
    </div>

    <div id="mineView" hidden>
      <div class="mk-grid" id="mkMine"><div class="mk-msg">加载中…</div></div>
    </div>
  </div>

  <!-- 发布应用弹窗 -->
  <div id="publishModal" class="mk-modal" hidden>
    <div class="mk-modal-card">
      <div class="mk-modal-head"><span id="publishTitle">发布应用</span> <button id="publishClose" title="关闭">✕</button></div>
      <form id="publishForm">
        <div class="mk-field">
          <label>应用名称 *</label>
          <input type="text" id="fName" maxlength="60" placeholder="例如：Notion" required />
        </div>
        <div class="mk-field">
          <label>应用地址（URL）*</label>
          <input type="text" id="fUrl" placeholder="https://example.com" required />
        </div>
        <div class="mk-field">
          <label>分类</label>
          <input type="text" id="fCategory" maxlength="20" placeholder="例如：效率 / 设计 / 开发" />
        </div>
        <div class="mk-field">
          <label>图标地址（可选，留空则用站点 favicon）</label>
          <input type="text" id="fIcon" placeholder="https://example.com/icon.png" />
        </div>
        <div class="mk-field">
          <label>简介（可选）</label>
          <textarea id="fDesc" maxlength="500" placeholder="一句话介绍这个应用…"></textarea>
        </div>
        <label class="mk-check"><input type="checkbox" id="fPc2" /> 支持 PC（电脑端）</label>
        <label class="mk-check"><input type="checkbox" id="fMobile2" /> 支持手机端</label>
        <label class="mk-check"><input type="checkbox" id="fPwa2" /> 支持 PWA（可安装到桌面/主屏）</label>
        <button type="submit" class="mk-submit" id="publishSubmit">提交审核</button>
      </form>
    </div>
  </div>

  <!-- 匿名账号发布拦截：提醒先升级为正式账号 -->
  <div id="anonPublishModal" class="mk-modal" hidden>
    <div class="mk-modal-card">
      <div class="mk-modal-head"><span data-i18n="mk.publish.needUpgrade.title">请先完成注册</span> <button id="anonPublishClose" title="关闭">✕</button></div>
      <div class="mk-modal-body">
        <p data-i18n="mk.publish.needUpgrade.desc">发布应用需要正式账号。当前为游客账号，请先升级为正式账号（在「Web 应用导航」中：设置 → 升级为正式账号）后再来发布。</p>
        <div class="mk-modal-actions">
          <button id="anonPublishStay" class="btn ghost" data-i18n="mk.publish.needUpgrade.stay">稍后再说</button>
          <a id="anonPublishGo" class="btn primary" href="index.html" data-i18n="mk.publish.needUpgrade.go">去升级为正式账号</a>
        </div>
      </div>
    </div>
  </div>

  <script src="marketplace.js?v=15"></script>
</body>
</html>
