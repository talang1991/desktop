<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>管理后台 · Web 应用导航面板</title>
  <link rel="stylesheet" href="styles.css?v=89" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    // 避免主题闪烁：在渲染前应用已保存的主题
    try {
      if (localStorage.getItem("web-app-launcher:theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <style>
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif);
    }
    .padmin-wrap { max-width: 960px; margin: 0 auto; padding: 22px 18px 56px; }
    .padmin-top {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 0 14px; border-bottom: 1px solid var(--border);
    }
    .padmin-back {
      color: var(--text-2); text-decoration: none; font-size: 14px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .padmin-back:hover { color: var(--text); }
    .padmin-top h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; }
    .padmin-who { font-size: 13px; color: var(--text-2); }
    .padmin-who b { color: var(--primary); font-weight: 600; }
    #notice {
      margin-top: 18px; padding: 16px 18px; border: 1px solid var(--border);
      border-radius: 14px; background: var(--surface); color: var(--text-2); font-size: 14px;
    }
    #notice a { color: var(--primary); }
    .avatar-img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
    .badge-count { font-size: 12px; color: #b7791f; font-weight: 600; margin-left: 6px; }
    .mk-status { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
    .mk-status.pending { color: #b7791f; background: rgba(183,121,31,.12); }
    .mk-status.approved { color: #1a7f37; background: rgba(26,127,55,.12); }
    .mk-status.rejected { color: #d23; background: rgba(221,34,51,.12); }

    /* 应用详情弹窗 */
    .padmin-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200;
    }
    .padmin-modal[hidden] { display: none; }
    .padmin-modal-card {
      width: 100%; max-width: 480px; max-height: 90vh; overflow: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
    }
    .padmin-modal-head { display: flex; align-items: center; font-weight: 600; font-size: 16px; margin-bottom: 12px; }
    .padmin-modal-head button { margin-left: auto; border: none; background: none; color: var(--text-2); font-size: 18px; cursor: pointer; }
    .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .detail-icon {
      width: 48px; height: 48px; border-radius: 12px; overflow: hidden; flex: 0 0 auto;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--primary); font-size: 18px;
    }
    .detail-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-name { font-weight: 600; font-size: 16px; }
    .detail-url { font-size: 13px; color: var(--primary); word-break: break-all; }
    .detail-row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .detail-label { color: var(--text-2); flex: 0 0 108px; }
    .detail-val { flex: 1; word-break: break-all; }
    .detail-desc { line-height: 1.5; white-space: pre-wrap; }
    .detail-banner-img { max-width: 100%; width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-2); }
    .detail-banner-block { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 6px; }
    .banner-upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .banner-upload-row .hint { font-size: 12px; color: var(--text-soft); opacity: 0.85; }
    .padmin-modal-foot { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  /* 版本发布管理 */
  .admin-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 18px;
  }
  .version-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .version-label { font-size: 13px; color: var(--text-2); flex: 0 0 auto; }
  .version-no { font-weight: 600; font-size: 15px; color: var(--primary); }
  .version-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--text-2); }
  .version-field .input {
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
    box-sizing: border-box; width: 100%; resize: vertical;
  }
  .version-field textarea.input { line-height: 1.6; }
  .version-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; }
  .version-actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .version-msg { font-size: 13px; color: var(--primary); }
  .version-msg.err { color: var(--danger); }
  .version-edit-hint { font-size: 12px; color: var(--text-2); }

  /* 版本列表表格 */
  .admin-table-wrap { margin-bottom: 18px; overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .admin-table th { background: var(--surface-2); color: var(--text-2); font-weight: 600; white-space: nowrap; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table .admin-empty { text-align: center; color: var(--text-2); padding: 18px; }
  .admin-table .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-table .ver-no { font-weight: 600; color: var(--primary); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; line-height: 1.6; }
  .badge.on { background: rgba(34,197,94,.16); color: #16a34a; }
  .badge.off { background: var(--surface-2); color: var(--text-2); }
  .badge.force { background: rgba(239,68,68,.16); color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <div class="padmin-wrap">
    <div class="padmin-top">
      <a class="padmin-back" id="adminBack" href="index.html">← 返回应用</a>
      <h1>管理后台</h1>
      <div class="padmin-who">当前管理员：<b id="adminWho">…</b></div>
    </div>

    <div id="notice" hidden></div>

    <div id="adminMain">
      <div class="admin-section-title">版本发布</div>
      <div class="admin-card" id="versionCard">
        <label class="version-field">
          <span>版本号（留空则该构建不弹窗，可在后台补填）</span>
          <input id="versionInput" class="input" type="text" maxlength="64" placeholder="如 1.2.0" />
        </label>
        <div class="version-row">
          <span class="version-label">记录</span>
          <span id="versionNo" class="version-no"></span>
        </div>
        <label class="version-field">
          <span>发布标题</span>
          <input id="versionTitle" class="input" type="text" maxlength="200" placeholder="如：v1.2.0 正式发布" />
        </label>
        <label class="version-field">
          <span>发布说明（release notes，支持换行）</span>
          <textarea id="versionNote" class="input" rows="6" maxlength="5000" placeholder="每行一条更新内容…"></textarea>
        </label>
        <div class="version-row">
          <label class="version-toggle">
            <input id="versionShowPopup" type="checkbox" />
            <span>展示更新弹窗（前端启动后弹出更新内容）</span>
          </label>
        </div>
        <div class="version-row">
          <span class="version-label">发布时间</span>
          <input id="versionPublishedAt" class="input" type="datetime-local" />
        </div>
        <div class="version-actions">
          <span id="versionEditHint" class="version-edit-hint"></span>
          <button id="versionSave" class="btn primary" type="button">保存</button>
          <button id="versionEditClear" class="btn ghost" type="button" hidden>取消编辑指定版本</button>
          <span id="versionMsg" class="version-msg"></span>
        </div>
      </div>

      <div class="admin-section-title">版本列表</div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="versionTable">
          <thead>
            <tr>
              <th>版本</th>
              <th>标题</th>
              <th>发布时间</th>
              <th>弹窗</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="versionListBody">
            <tr><td colspan="6" class="admin-empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="admin-stats" id="adminStats"></div>
      <div class="admin-section-title">用户</div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>用户</th>
              <th>角色</th>
              <th>链接数</th>
              <th>注册时间</th>
              <th>最近活跃</th>
              <th>当前版本</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="adminUserRows"></tbody>
        </table>
      </div>

      <div class="admin-section-title">应用审核<span id="pendingCount" class="badge-count"></span></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>应用</th>
              <th>提交者</th>
              <th>支持 PC</th>
              <th>支持手机</th>
              <th>支持 PWA</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="adminAppRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 应用详情弹窗 -->
  <div id="appDetailModal" class="padmin-modal" hidden>
    <div class="padmin-modal-card">
      <div class="padmin-modal-head">应用详情 <button id="appDetailClose" title="关闭">✕</button></div>
      <div id="appDetailBody"></div>
      <div class="padmin-modal-foot" id="appDetailActions"></div>
    </div>
  </div>

  <script src="admin.js?v=6"></script>
</body>
</html>
